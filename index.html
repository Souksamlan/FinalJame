<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ແບບສອບຖາມ</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =========================
           BACKGROUND (CLEAR + CENTER FIX)
        ========================= */

        body {
            font-family: 'Noto Sans Lao', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;

            /* 🔥 ชัด + ไม่เบลอ */
            background-image: url("./bg-magic.jpeg");
            background-repeat: no-repeat;
            background-position: center;

            /* 👉 สำคัญ: เห็นครบทั้งภาพ */
            background-size: contain;

            background-color: #0f172a;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .main-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            text-align: center;
        }

        .text-header-zone {
            background: rgba(10, 20, 40, 0.65);
            padding: 30px;
            border-radius: 20px;
        }

        .text-header-zone h1 {
            font-size: 2.6rem;
            color: white;
        }

        .text-header-zone h2 {
            font-size: 1.2rem;
            color: #facc15;
            margin-top: 10px;
        }

        .text-header-zone p {
            color: #cbd5e1;
            margin-top: 10px;
        }

        /* BUTTON */
        .btn-google-form {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 45px;
            border-radius: 50px;
            border: 3px solid #facc15;
            background: rgba(15, 23, 42, 0.85);
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-google-form i {
            font-size: 24px;
            color: #a855f7;
            margin-bottom: 5px;
        }

        .btn-google-form span.main-btn-text {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .btn-google-form span.sub-btn-text {
            font-size: 0.85rem;
            color: #facc15;
        }

        .btn-google-form:hover {
            transform: scale(1.05);
            border-color: #fff;
        }

        /* FOOTER */
        .text-footer-zone {
            color: #e2e8f0;
            background: rgba(0,0,0,0.4);
            padding: 10px 25px;
            border-radius: 30px;
        }

        /* =========================
           RESPONSIVE (ONLY SCALE CONTROL)
        ========================= */

        @media (max-width: 1024px) {
            body {
                background-size: 110%;
            }
        }

        @media (max-width: 768px) {
            body {
                background-size: 120%;
            }

            .text-header-zone h1 {
                font-size: 2rem;
            }

            .text-header-zone h2 {
                font-size: 1rem;
            }

            .btn-google-form {
                width: 100%;
                padding: 18px;
            }
        }

        @media (max-width: 480px) {
            body {
                background-size: 140%;
            }

            .main-container {
                width: 95%;
            }

            .text-header-zone {
                padding: 20px;
            }

            .text-header-zone h1 {
                font-size: 1.7rem;
            }

            .btn-google-form span.main-btn-text {
                font-size: 1.1rem;
            }
        }

    </style>
</head>

<body>

<div class="main-container">

    <div class="text-header-zone">
        <h1>ແບບສອບຖາມ</h1>
        <h2>ສຶກສາຄວາມຄິດເຫັນຕໍ່ການເຮັດວຽກເສີມ</h2>
        <p>ຂໍຂອບໃຈທຸກຄົນ 🙏</p>
    </div>

    <a class="btn-google-form"
       href="https://docs.google.com/forms/d/e/Your-Form-ID/viewform"
       target="_blank">

        <i class="fa-solid fa-file-pen"></i>
        <span class="main-btn-text">ຄລິກເພື່ອຕອບ</span>
        <span class="sub-btn-text">Google Form</span>
    </a>

    <div class="text-footer-zone">
        ຂໍຂອບໃຈ ❤️
    </div>

</div>

</body>
</html>
